<!doctype html>
<!-- Template for public/og.png (1200×630 share card). Regenerate with `pnpm og`. -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Speaker share card</title>
    <style>
      :root {
        /* Same light-theme tokens as src/styles.css. */
        --bg: #faf9f7;
        --text: #1a1816;
        --muted: #6b6661;
        --coral: #ee6a4c;
        --button: #d95c40;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        display: flex;
        align-items: center;
        gap: 70px;
        padding: 0 80px 0 110px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body::after {
        content: '';
        position: absolute;
        inset: auto 0 0 0;
        height: 10px;
        background: var(--coral);
      }

      .icon {
        position: relative;
        flex: none;
        width: 340px;
        height: 340px;
      }

      .icon::before {
        content: '';
        position: absolute;
        inset: -70px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgb(238 106 76 / 0.12), rgb(238 106 76 / 0));
      }

      .icon img {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .name {
        margin: 0 0 14px;
        font-size: 34px;
        font-weight: 600;
        color: var(--button);
      }

      h1 {
        margin: 0 0 26px;
        font-size: 76px;
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: -1px;
      }

      .lines {
        margin: 0;
        font-size: 28px;
        line-height: 1.5;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="icon"><img src="../../Resources/AppIcon.png" alt="" /></div>
    <div>
      <p class="name">Speaker</p>
      <h1>Mac 语音输入<br />说话代替打字</h1>
      <p class="lines">按住 Fn 说话，松开后文字出现在光标处<br />自带 API Key · 免费开源 · macOS 14+</p>
    </div>
  </body>
</html>
