name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: speaker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The fast lane a pull request waits on: deterministic specifications, the
  # shell contract tests, the warnings-as-errors builds, and the formatting
  # check. It gates the slow bundling lane below, so a broken specification is
  # reported in minutes instead of after a release build and an install.
  specifications:
    name: Specifications, warnings, and formatting
    runs-on: macos-26
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Record toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          SDK_CANONICAL_NAME="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CanonicalName' \
              "$SDK_PATH/SDKSettings.plist"
          )"
          SDK_MAJOR="${SDK_CANONICAL_NAME#macosx}"
          SDK_MAJOR="${SDK_MAJOR%%.*}"
          test "$SDK_MAJOR" -ge 26
          echo "SPEAKER_SDKROOT=$SDK_PATH" >> "$GITHUB_ENV"
          echo "Selected SDK: $SDK_CANONICAL_NAME ($SDK_PATH)"

      # SwiftPM build products are reusable only for the exact resolved
      # dependency graph, so the key carries the Package.resolved hash. The
      # commit suffix keeps every run publishing a fresh incremental cache while
      # the prefix restore key still matches the newest cache for that graph.
      # The slow lane deliberately does not restore this cache: it builds the
      # release bundle in an isolated scratch path.
      - name: Cache SwiftPM build products
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}-

      # The tree is formatted to the root .swift-format configuration, so this
      # check is blocking.
      - name: Check Swift formatting
        run: swift format lint --strict --parallel --recursive Sources Tests

      - name: Run deterministic specifications
        run: ./scripts/test

      - name: Verify resolved dependencies are pristine
        shell: zsh {0}
        run: |
          source scripts/release-common
          verify_swiftpm_dependency_checkouts_clean "$PWD"

      - name: Treat compiler warnings as errors
        run: >-
          ./scripts/swiftw build
          --disable-sandbox
          --configuration debug
          --product SpeakerApp
          -Xswiftc -warnings-as-errors

      - name: Treat release compiler warnings as errors
        run: >-
          ./scripts/swiftw build
          --disable-sandbox
          --configuration release
          --product SpeakerApp
          -Xswiftc -warnings-as-errors

      - name: Check scripts and patch hygiene
        run: |
          zsh -n scripts/*
          git diff --check

  # The slow lane, gated by the fast one. `Test, build, and bundle` is the
  # required status check on main; keep this name.
  verify:
    name: Test, build, and bundle
    needs: specifications
    runs-on: macos-26
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Record toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          SDK_CANONICAL_NAME="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CanonicalName' \
              "$SDK_PATH/SDKSettings.plist"
          )"
          SDK_MAJOR="${SDK_CANONICAL_NAME#macosx}"
          SDK_MAJOR="${SDK_MAJOR%%.*}"
          test "$SDK_MAJOR" -ge 26
          echo "SPEAKER_SDKROOT=$SDK_PATH" >> "$GITHUB_ENV"
          echo "Selected SDK: $SDK_CANONICAL_NAME ($SDK_PATH)"

      - name: Build and validate isolated release bundle
        env:
          SPEAKER_CONFIGURATION: release
          SPEAKER_BUNDLE_PENDING_ROOT: ${{ runner.temp }}/speaker-release-pending
          SPEAKER_SWIFT_SCRATCH_PATH: ${{ runner.temp }}/speaker-release-pending/swift-build
          SPEAKER_BUNDLE_OUTPUT_APP: ${{ runner.temp }}/speaker-release-pending/Speaker.app
          SPEAKER_SWIFT_RELEASE_ISOLATION: "1"
        run: |
          mkdir -p "$SPEAKER_BUNDLE_PENDING_ROOT"
          chmod 700 "$SPEAKER_BUNDLE_PENDING_ROOT"
          ./scripts/bundle

      - name: Verify release identity and integrity
        env:
          SPEAKER_BUNDLE_OUTPUT_APP: ${{ runner.temp }}/speaker-release-pending/Speaker.app
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$SPEAKER_BUNDLE_OUTPUT_APP/Contents/Info.plist")" = "com.local.speaker"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SpeakerCredentialStorage' "$SPEAKER_BUNDLE_OUTPUT_APP/Contents/Info.plist")" = "local-file"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SpeakerSigningMode' "$SPEAKER_BUNDLE_OUTPUT_APP/Contents/Info.plist")" = "development-ad-hoc"
          cmp PRIVACY.md "$SPEAKER_BUNDLE_OUTPUT_APP/Contents/Resources/PRIVACY.md"
          codesign --verify --deep --strict --verbose=2 "$SPEAKER_BUNDLE_OUTPUT_APP"

      - name: Verify release evidence dSYM binding
        env:
          SPEAKER_EVIDENCE_TEST_APP: ${{ runner.temp }}/speaker-release-pending/Speaker.app
        run: ./scripts/test-release-evidence

      - name: Archive validated release candidate
        run: |
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "${{ runner.temp }}/speaker-release-pending/Speaker.app" \
            "${{ runner.temp }}/Speaker-ci-${{ github.sha }}.zip"
          (cd "${{ runner.temp }}" && /usr/bin/shasum -a 256 \
            "Speaker-ci-${{ github.sha }}.zip" \
            > "Speaker-ci-${{ github.sha }}.zip.sha256")

      - name: Retain validated release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Speaker-ci-${{ github.sha }}
          path: |
            ${{ runner.temp }}/Speaker-ci-${{ github.sha }}.zip
            ${{ runner.temp }}/Speaker-ci-${{ github.sha }}.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Verify install rollback
        run: ./scripts/test-install-rollback

      - name: Verify reviewed release identity guard
        run: ./scripts/test-release-identity

  development-prerelease:
    name: Publish development prerelease
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 10
    concurrency:
      group: speaker-development-prerelease
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out validated source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve development release
        id: release
        shell: zsh {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/release-common
          VERSION="$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleShortVersionString' \
            Resources/Info.plist)"
          validate_bundle_metadata "$VERSION" "1" "com.local.speaker"
          TAG="v${VERSION}-dev"

          if RELEASE_STATE="$(gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isPrerelease \
            --jq '.isPrerelease' 2>/dev/null)"; then
            [[ "$RELEASE_STATE" == "true" ]] || {
              print -u2 "Refusing to reuse non-prerelease tag: $TAG"
              exit 1
            }
            print "Development prerelease already exists: $TAG"
            print "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh api \
            --silent \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>/dev/null; then
            print -u2 "Refusing to reuse orphaned tag: $TAG"
            exit 1
          fi

          print "publish=true" >> "$GITHUB_OUTPUT"
          print "tag=$TAG" >> "$GITHUB_OUTPUT"
          print "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download validated development bundle
        if: steps.release.outputs.publish == 'true'
        shell: zsh {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/release-common
          ARTIFACT_NAME="Speaker-ci-$GITHUB_SHA"
          ARTIFACT_ID="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\") | .id")"
          matches_release_pattern "$ARTIFACT_ID" '^[1-9][0-9]*$' || {
            print -u2 "Validated CI artifact is missing or ambiguous."
            exit 1
          }

          CANDIDATE="$RUNNER_TEMP/speaker-development-candidate"
          ARTIFACT_ZIP="$RUNNER_TEMP/speaker-development-artifact.zip"
          mkdir -p "$CANDIDATE"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > "$ARTIFACT_ZIP"
          /usr/bin/ditto -x -k "$ARTIFACT_ZIP" "$CANDIDATE"

      - name: Verify and name release assets
        if: steps.release.outputs.publish == 'true'
        shell: zsh {0}
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          CANDIDATE="$RUNNER_TEMP/speaker-development-candidate"
          SOURCE_ZIP="$CANDIDATE/Speaker-ci-$GITHUB_SHA.zip"
          SOURCE_CHECKSUM="$SOURCE_ZIP.sha256"
          RELEASE_ROOT="$RUNNER_TEMP/speaker-development-release"
          EXTRACT_ROOT="$RUNNER_TEMP/speaker-development-extract"
          ASSET_BASENAME="Speaker-${VERSION}-development.zip"
          ASSET="$RELEASE_ROOT/$ASSET_BASENAME"

          mkdir -p "$RELEASE_ROOT" "$EXTRACT_ROOT"
          (cd "$CANDIDATE" && /usr/bin/shasum -a 256 -c \
            "${SOURCE_CHECKSUM:t}")
          cp "$SOURCE_ZIP" "$ASSET"
          (cd "$RELEASE_ROOT" && /usr/bin/shasum -a 256 \
            "$ASSET_BASENAME" > "$ASSET_BASENAME.sha256")
          /usr/bin/ditto -x -k "$ASSET" "$EXTRACT_ROOT"

          APP="$EXTRACT_ROOT/Speaker.app"
          [[ -d "$APP" ]]
          [[ "$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleShortVersionString' \
            "$APP/Contents/Info.plist")" == "$VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy \
            -c 'Print :SpeakerSigningMode' \
            "$APP/Contents/Info.plist")" == "development-ad-hoc" ]]
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create GitHub development prerelease
        if: steps.release.outputs.publish == 'true'
        shell: zsh {0}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_ROOT="$RUNNER_TEMP/speaker-development-release"
          NOTES="$RUNNER_TEMP/speaker-development-release-notes.md"
          print -r -- 'Automated development build from the validated `main` commit.' \
            '' \
            '> This app is ad-hoc signed and not notarized. It is intended for development testing only. macOS may require renewed Microphone and Accessibility permissions after installation.' \
            '' \
            "Source commit: \`$GITHUB_SHA\`" \
            > "$NOTES"

          gh release create "$TAG" \
            "$RELEASE_ROOT/Speaker-${VERSION}-development.zip#Speaker ${VERSION} development app" \
            "$RELEASE_ROOT/Speaker-${VERSION}-development.zip.sha256#SHA-256 checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Speaker $VERSION Development Prerelease" \
            --notes-file "$NOTES" \
            --prerelease
