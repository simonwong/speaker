name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: speaker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Sorts the changed paths into the landing page (site/), files no check
  # reads (docs/, the READMEs, the agent guides, LICENSE), and everything else.
  # A change confined to the first two skips the macOS lanes; site/ also builds
  # the page. Anything this job cannot classify counts as an app change, so
  # list a path as unchecked only when no test, script, or bundle reads it.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.detect.outputs.app }}
      site: ${{ steps.detect.outputs.site }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          FILES=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # The checkout is the merge commit; its first parent is the base.
            FILES="$(git diff --name-only HEAD^1 HEAD)"
          elif [[ "$EVENT_NAME" == "push" ]] \
            && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            FILES="$(git diff --name-only "$BEFORE_SHA" HEAD)"
          fi

          APP=false
          SITE=false
          if [[ -z "$FILES" ]]; then
            APP=true
            SITE=true
          fi
          while IFS= read -r FILE; do
            [[ -n "$FILE" ]] || continue
            case "$FILE" in
              site/*) SITE=true ;;
              docs/*|README.md|README.*.md|AGENTS.md|CLAUDE.md|CONTEXT.md|LICENSE) ;;
              *) APP=true ;;
            esac
          done <<< "$FILES"

          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "site=$SITE" >> "$GITHUB_OUTPUT"
          echo "app=$APP site=$SITE"

  site:
    name: Build landing page
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  # Deterministic specifications, the shell contract tests, the
  # warnings-as-errors builds, and the formatting check. It runs alongside the
  # bundling lane below; the `required` job reports both.
  specifications:
    name: Specifications, warnings, and formatting
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          SDK_CANONICAL_NAME="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CanonicalName' \
              "$SDK_PATH/SDKSettings.plist"
          )"
          SDK_MAJOR="${SDK_CANONICAL_NAME#macosx}"
          SDK_MAJOR="${SDK_MAJOR%%.*}"
          test "$SDK_MAJOR" -ge 26
          echo "SPEAKER_SDKROOT=$SDK_PATH" >> "$GITHUB_ENV"
          echo "Selected SDK: $SDK_CANONICAL_NAME ($SDK_PATH)"

      # SwiftPM build products are reusable only for the exact resolved
      # dependency graph, so the key carries the Package.resolved hash. The
      # commit suffix keeps every run publishing a fresh incremental cache while
      # the prefix restore key still matches the newest cache for that graph.
      # The bundling lane deliberately does not restore this cache: it builds
      # the release bundle in an isolated scratch path.
      - name: Cache SwiftPM build products
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}-

      # The tree is formatted to the root .swift-format configuration, so this
      # check is blocking.
      - name: Check Swift formatting
        run: swift format lint --strict --parallel --recursive Sources Tests

      - name: Run deterministic specifications
        env:
          SPEAKER_SPEC_TRACE: "1"
        run: ./scripts/test --with-ui

      - name: Verify resolved dependencies are pristine
        shell: zsh {0}
        run: |
          source scripts/release-common
          verify_swiftpm_dependency_checkouts_clean "$PWD"

      - name: Treat compiler warnings as errors
        run: >-
          ./scripts/swiftw build
          --disable-sandbox
          --configuration debug
          --product SpeakerApp
          -Xswiftc -warnings-as-errors

      - name: Treat release compiler warnings as errors
        run: >-
          ./scripts/swiftw build
          --disable-sandbox
          --configuration release
          --product SpeakerApp
          -Xswiftc -warnings-as-errors

      - name: Check scripts and patch hygiene
        run: |
          zsh -n scripts/*
          git diff --check

  # The release bundle and the install checks. It does not wait for
  # `specifications`: the two lanes run side by side and `required` joins them.
  verify:
    name: Release bundle and install
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          SDK_CANONICAL_NAME="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CanonicalName' \
              "$SDK_PATH/SDKSettings.plist"
          )"
          SDK_MAJOR="${SDK_CANONICAL_NAME#macosx}"
          SDK_MAJOR="${SDK_MAJOR%%.*}"
          test "$SDK_MAJOR" -ge 26
          echo "SPEAKER_SDKROOT=$SDK_PATH" >> "$GITHUB_ENV"
          echo "Selected SDK: $SDK_CANONICAL_NAME ($SDK_PATH)"

      - name: Build and validate isolated release bundle
        env:
          SPEAKER_CONFIGURATION: release
          SPEAKER_BUNDLE_PENDING_ROOT: ${{ runner.temp }}/speaker-release-pending
          SPEAKER_SWIFT_SCRATCH_PATH: ${{ runner.temp }}/speaker-release-pending/swift-build
          SPEAKER_BUNDLE_OUTPUT_APP: ${{ runner.temp }}/speaker-release-pending/Speaker.app
          SPEAKER_SWIFT_RELEASE_ISOLATION: "1"
        run: |
          mkdir -p "$SPEAKER_BUNDLE_PENDING_ROOT"
          chmod 700 "$SPEAKER_BUNDLE_PENDING_ROOT"
          ./scripts/bundle

      - name: Verify release identity and integrity
        env:
          SPEAKER_BUNDLE_OUTPUT_APP: ${{ runner.temp }}/speaker-release-pending/Speaker.app
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$SPEAKER_BUNDLE_OUTPUT_APP/Contents/Info.plist")" = "app.local.speaker"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SpeakerDataDirectoryName' "$SPEAKER_BUNDLE_OUTPUT_APP/Contents/Info.plist")" = "Speaker Dev"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SpeakerCredentialStorage' "$SPEAKER_BUNDLE_OUTPUT_APP/Contents/Info.plist")" = "local-file"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SpeakerSigningMode' "$SPEAKER_BUNDLE_OUTPUT_APP/Contents/Info.plist")" = "development-ad-hoc"
          cmp PRIVACY.md "$SPEAKER_BUNDLE_OUTPUT_APP/Contents/Resources/PRIVACY.md"
          codesign --verify --deep --strict --verbose=2 "$SPEAKER_BUNDLE_OUTPUT_APP"

      - name: Verify release evidence dSYM binding
        env:
          SPEAKER_EVIDENCE_TEST_APP: ${{ runner.temp }}/speaker-release-pending/Speaker.app
        run: ./scripts/test-release-evidence

      - name: Verify install rollback
        run: ./scripts/test-install-rollback

      - name: Verify reviewed release identity guard
        run: ./scripts/test-release-identity

  # `Test, build, and bundle` is the required status check on main; keep this
  # name. Branch protection treats a skipped required check as passing, so this
  # job runs whenever the lanes above might have run and fails unless both
  # passed; a skipped, failed, or cancelled lane fails it. The one deliberate
  # skip is a change `changes` reports as app == 'false' (site/ or unchecked
  # files only). A failed `changes` job leaves that output empty, so this job
  # still runs and fails below.
  required:
    name: Test, build, and bundle
    needs: [changes, specifications, verify]
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require every lane to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SPECIFICATIONS_RESULT: ${{ needs.specifications.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES_RESULT specifications=$SPECIFICATIONS_RESULT verify=$VERIFY_RESULT"
          STATUS=0
          if [[ "$CHANGES_RESULT" != success ]]; then
            echo "::error::Detect changed areas did not pass ($CHANGES_RESULT)."
            STATUS=1
          fi
          if [[ "$SPECIFICATIONS_RESULT" != success ]]; then
            echo "::error::Specifications, warnings, and formatting did not pass ($SPECIFICATIONS_RESULT)."
            STATUS=1
          fi
          if [[ "$VERIFY_RESULT" != success ]]; then
            echo "::error::Release bundle and install did not pass ($VERIFY_RESULT)."
            STATUS=1
          fi
          exit "$STATUS"
