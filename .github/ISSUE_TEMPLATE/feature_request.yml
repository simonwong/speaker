name: 功能请求
description: 提出新的功能或对现有行为的改进建议。
title: "[Feature] "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        请描述你遇到的实际问题，而不是直接给出实现方案。

        **不要在这里粘贴转录文字、音频或 API Key**，详见
        [PRIVACY.md](https://github.com/simonwong/speaker/blob/main/PRIVACY.md)。

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认本 issue 及其附件不包含转录文字、音频或 API Key。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题场景
      description: 你在什么情况下遇到了什么障碍？现在只能怎么绕开？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 你希望 Speaker 做什么。涉及界面时说明出现在哪个页面或菜单。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 其他工具或做法为什么不够用。
    validations:
      required: false

  - type: input
    id: speaker-version
    attributes:
      label: 当前使用的 Speaker 版本
      placeholder: "例如：0.4.0 (1)"
    validations:
      required: false
